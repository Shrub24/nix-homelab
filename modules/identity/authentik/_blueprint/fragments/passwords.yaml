# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: homelab-passwords
entries:
  - attrs:
      check_static_rules: true
      check_zxcvbn: true
      length_min: 8
      password_field: password
      zxcvbn_score_threshold: 2
      error_message: Choose a password of at least 8 characters that is not easily guessed.
    id: enrollment-password-policy
    identifiers:
      name: !Format ['%s-password-policy', !Context enrollment-flow]
    model: authentik_policies_password.passwordpolicy
