# Validation only. Building checks against the fleet's builders is a separate
# path with its own workflow (fleet-build.yml), which calls this one first so a
# failing contract still gates a privileged publication run. Nothing here can
# build fleet outputs on any event.
#
# The two derivations this job does build are its own tooling, not fleet
# outputs: the formatter check, and the flake.nix freshness comparator (both
# seconds, neither compiling a host closure). A whole-flake
# `nix flake check --no-build` gate cannot be added here — evaluating this flake
# realises degoog's unsubstitutable bun2nix import-from-derivation, so an
# evaluation-only gate cannot pass on a cold store (D-082) — so the comparator
# carries the evaluation coverage and the dispatched build carries the wiring
# gate.
name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  # Callable by fleet-build.yml, so validation gates the build without the
  # steps being written twice.
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nix for local validation
        uses: nixbuild/nix-quick-install-action@v35
      - name: Check cross-language formatting
        run: nix develop --command treefmt --fail-on-change
      - name: Run standard checks
        run: nix develop --command just checks all
