# The fleet build plane, deliberately outside routine validation: dispatched by
# hand, on main only, so no push or pull request can reach it.
#
# The build is nix-fleet's reusable coordinator: one job builds the approved
# selection for both systems, distributing to the fleet's builders from the
# rendered `ci` profile and publishing through niks3 from both the builders and
# this runner. The coordinator, the builder list, the cache coordinates and the
# tailnet identity all resolve from the revision pinned below, so a bump moves
# the machinery and the fleet facts together and this file holds no coordinate.
name: fleet-build
on:
  workflow_dispatch:
concurrency:
  group: fleet-build
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Validation gates the build: a failing contract or formatting check must not
  # reach a privileged publication run.
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    # Main-only: the cache's OIDC claims are main-scoped, so a branch dispatch
    # must not reach publication at all.
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: Shrub24/nix-fleet/.github/workflows/build-push-cache.yml@v3
    permissions:
      contents: read
      id-token: write
    with:
      # x86_64 coordinator: most of the fleet's build work is x86_64, and a
      # foreign-architecture target cannot fall back to the runner's own store.
      runner_system: x86_64-linux
      systems: x86_64-linux aarch64-linux
      profile: ci
      # `.#checks` includes `checks.packages`, so a build realises the retention
      # root `pin-cache` later holds a name against.
      targets: .#checks
    secrets:
      BUILDER_SSH_KEY: ${{ secrets.FLEET_BUILDER_SSH_KEY }}
