# secrets/services/paperless.yaml – Paperless-ngx service environment secrets
# Encrypted to: owner, oci-melb-1
# Key path: secrets/services/paperless.yaml
# Used as sops key source for the paperless service container.
paperless:
  secret_key: <value>
  admin_pass: <value>

# Paperless-gpt API token stored here (same file, separate key path).
# Generate from Paperless web UI: Settings → API Tokens → Create.
paperless-gpt:
  api_token: <value>
