# Scheduled package refresh: a thin caller for nix-fleet's producer, which this
# repository used to copy. Refreshing flake inputs, running the registered
# package updaters and opening one proposal pull request are all the fleet's now;
# only the cadence is local.
#
# The proposal is a source for the candidate pipeline, not an acceptance: the
# pull request it opens is validated, built and cache-verified before promotion.
name: package-updates-refresh
on:
  schedule:
    # Weekly: the build each proposal triggers is a full fleet build.
    - cron: "43 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    uses: Shrub24/nix-fleet/.github/workflows/package-updates-refresh.yml@v3
    permissions:
      contents: read
