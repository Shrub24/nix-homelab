# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: homelab-mfa
entries:
  # The upstream stage skips users with no device. Requiring it instead injects the
  # configuration stages below, which is the enrolment route for every flow bound to it.
  - attrs:
      # The email code behind the password option is implicit; TOTP is accepted but not offered here.
      configuration_stages:
        - !KeyOf passkey-setup
        - !KeyOf enrollment-email-setup
      device_classes:
        - webauthn
        - totp
        - email
      not_configured_action: configure
      webauthn_user_verification: required
    id: mfa-validation
    identifiers:
      name: default-authentication-mfa-validation
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
