name: deploy-host
on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
    secrets:
      NIXBUILD_TOKEN:
        required: true
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_AUDIENCE:
        required: true
jobs:
  deploy-host:
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      id-token: write
    env:
      NIXBUILD_STORE: ssh-ng://eu.nixbuild.net
      DEPLOY_HOST: ${{ inputs.host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Setup nixbuild
        uses: ./.github/actions/setup-nixbuild
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
      - name: Join Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ inputs.host }}
      - name: Prebuild ${{ inputs.host }} deploy profile
        run: |
          nix build \
            --no-link \
            --no-write-lock-file \
            --print-build-logs \
            --eval-store auto \
            --store "$NIXBUILD_STORE" \
            "path:.#deploy.nodes.\"$DEPLOY_HOST\".profiles.system.path"
      - name: Resolve host deploy policy
        id: policy
        run: |
          STRICT=$(nix eval --raw --no-write-lock-file --apply 'value: if value then "true" else "false"' "path:.#deployHosts.\"$DEPLOY_HOST\".strictSubstituteOnly")
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
      - name: Deploy ${{ inputs.host }}
        run: |
          ARGS=(
            --skip-checks
            --remote-build
            --ssh-opts="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          )
          NIX_ARGS=()
          if [[ "${{ steps.policy.outputs.strict }}" == "true" ]]; then
            NIX_ARGS=(-- --option max-jobs 0 --option builders "")
          fi
          nix run path:.#deploy-rs -- \
            "${ARGS[@]}" \
            ".#$DEPLOY_HOST" \
            "${NIX_ARGS[@]}"
