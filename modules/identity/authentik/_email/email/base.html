{% load authentik_stages_email %}<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Shrublab</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        background: #f4f6f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        color: #14161a;
        -webkit-text-size-adjust: 100%;
      }

      h1 {
        font-size: 20px;
        line-height: 1.35;
        font-weight: 700;
        margin: 0 0 12px 0;
        color: #14161a;
      }

      .btn a {
        display: inline-block;
        min-width: 200px;
        padding: 13px 24px;
        background: #256014;
        color: #ffffff !important;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 10px;
      }

      .properties-table {
        width: 100%;
        font-size: 13px;
        border-collapse: collapse;
        color: #14161a;
      }

      .properties-table td {
        padding: 6px 0;
        border-top: 1px solid #e2e7dd;
        vertical-align: top;
      }

      .td-right {
        color: #5a6270;
        text-align: right;
        white-space: nowrap;
        padding-right: 12px;
      }
    </style>
  </head>

  <body>
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background: #f4f6f2;">
      <tr>
        <td align="center" style="padding: 40px 20px;">
          <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 480px;">
            <tr>
              <td align="center" style="padding-bottom: 24px;">
                <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: lowercase; color: #256014;">shrublab</span>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin-top: 10px;">
                  <tr>
                    <td style="height: 3px; width: 48px; background: #75df48; font-size: 0; line-height: 0;">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="background: #ffffff; border: 1px solid #e2e7dd; border-radius: 14px; padding: 32px 28px;">
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="color: #14161a;">
                  {% block content %}{% endblock %}
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 4px 0 4px; font-size: 13px; color: #5a6270;" align="center">
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  {% block sub_content %}{% endblock %}
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top: 20px; font-size: 12px; color: #6b7280;">
                Shrublab &middot; sent because this address belongs to a Shrublab account.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
