name: deploy-host
on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_AUDIENCE:
        required: true
jobs:
  deploy-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ inputs.host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      # Deployment joins the tailnet with its own identity. The build
      # coordinator key is a build credential and never becomes a deployment
      # key; this path authorizes activation, not building.
      - name: Join Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ inputs.host }}
      - name: Derive verified known_hosts for ${{ inputs.host }}
        id: known-hosts
        run: |
          set -euo pipefail
          # Only hosts with a source-controlled hostKeyFingerprint get a
          # dedicated known_hosts file, and only after the discovered ed25519
          # key matches that fingerprint exactly. Hosts without a declared
          # fingerprint never receive an insecure host-checking override; they
          # keep normal SSH verification (which fails safely in a fresh runner).
          FINGERPRINT="$(nix eval --raw --no-write-lock-file --apply "t: let f = t.nodes.\"$DEPLOY_HOST\".hostKeyFingerprint or null; in if f == null then \"\" else f" .#deployHosts)"
          if [[ -n "$FINGERPRINT" ]]; then
            KNOWN_HOSTS="${RUNNER_TEMP}/known_hosts_${DEPLOY_HOST}"
            scripts/ssh-known-hosts.sh emit "$DEPLOY_HOST" "$FINGERPRINT" "$KNOWN_HOSTS"
            echo "known_hosts=$KNOWN_HOSTS" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hostKeyFingerprint declared for $DEPLOY_HOST; deploying with normal SSH host-key verification"
            echo "known_hosts=" >> "$GITHUB_OUTPUT"
          fi
      # Publication belongs to the build job. A deployment verifies the exact
      # profile it will activate is already in the cache instead of compiling it
      # here: with no local jobs and no builders, a cache miss fails loudly
      # rather than turning into a silent host-side build.
      - name: Verify the ${{ inputs.host }} profile is cached
        run: |
          set -euo pipefail
          # A fresh runner's substituter set is not the fleet's, so read the host's
          # own catalog out of its evaluation rather than restating it here: the
          # catalog is nix-fleet's baseline, and the host is the authority on it.
          CATALOG="$(nix eval --json --no-write-lock-file --apply '
            c: {
              substituters = builtins.concatStringsSep " " c.nix.settings.substituters;
              keys = builtins.concatStringsSep " " c.nix.settings.trusted-public-keys;
            }' ".#nixosConfigurations.\"$DEPLOY_HOST\".config")"
          # Evaluation is allowed to realise what it cannot substitute — degoog's
          # bundle evaluates through a bun2nix import-from-derivation whose
          # generator is `runCommandLocal`, so no cache can carry it and a cold
          # runner builds that one step. The profile itself is what must be
          # signed-substituted, so the build below has no local jobs and no
          # builders: a cache miss fails here instead of compiling on the runner.
          PROFILE_DRV="$(nix eval --raw --no-write-lock-file ".#deploy.nodes.\"$DEPLOY_HOST\".profiles.system.path.drvPath")"
          nix build \
            --no-link \
            --option max-jobs 0 \
            --option builders "" \
            --option substituters "$(jq -r .substituters <<<"$CATALOG")" \
            --option trusted-public-keys "$(jq -r .keys <<<"$CATALOG")" \
            "$PROFILE_DRV"
      - name: Resolve host deploy policy
        id: policy
        run: |
          STRICT=$(nix eval --raw --no-write-lock-file --apply 'value: if value then "true" else "false"' ".#deployHosts.nodes.\"$DEPLOY_HOST\".strictSubstituteOnly")
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
      - name: Configure SSH for ${{ inputs.host }}
        run: |
          # Verified known_hosts and strict host checking are configured through
          # an ephemeral ~/.ssh/config Host entry rather than a CLI ssh-opts
          # override, so host checking is never disabled, never auto-accepted.
          KNOWN_HOSTS="${{ steps.known-hosts.outputs.known_hosts }}"
          if [[ -n "$KNOWN_HOSTS" ]]; then
            mkdir -p ~/.ssh
            {
              echo "Host $DEPLOY_HOST"
              echo "  UserKnownHostsFile $KNOWN_HOSTS"
              echo "  StrictHostKeyChecking yes"
            } >> ~/.ssh/config
          fi
      - name: Deploy ${{ inputs.host }}
        run: |
          ARGS=(
            --skip-checks
            --remote-build
          )
          NIX_ARGS=()
          if [[ "${{ steps.policy.outputs.strict }}" == "true" ]]; then
            NIX_ARGS=(-- --option max-jobs 0 --option builders "")
          fi
          nix run .#deploy-rs -- \
            "${ARGS[@]}" \
            ".#$DEPLOY_HOST" \
            "${NIX_ARGS[@]}"
