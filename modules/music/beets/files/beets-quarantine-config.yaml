directory: __MUSIC_LIBRARY_DIR__
library: __BEETS_STATE_DB__
plugins: badfiles bandcamp chroma convert discogs fetchart embedart fromfilename inline duplicates spotify deezer unimported
# item_fields:
#   source_filename: |
#     import os
#     from beets.util import bytestring_path
#     return bytestring_path(os.path.basename(path))
#   source_stem: |
#     import os
#     from beets.util import bytestring_path
#     source_name = os.path.basename(path)
#     source_stem, _ = os.path.splitext(source_name)
#     return bytestring_path(source_stem)
ignore:
  - ".stversions/**"
  - ".stfolder"
import:
  write: yes
  copy: no
  move: yes
  link: no
  hardlink: no
  quiet_fallback: skip
  incremental: no
  incremental_skip_later: no
  singletons: no
  group_albums: yes
  duplicate_action: ask
  timid: yes
match:
  strong_rec_thresh: 0.10
  medium_rec_thresh: 0.30
  distance_weights:
    media: 0.2
    albumdisambig: 0.0
    catalognum: 0.0
    missing_tracks: 0.0
    unmatched_tracks: 0.0
    data_source: 0.1
  max_rec:
    missing_tracks: strong
    unmatched_tracks: strong
fetchart:
  auto: yes
  cautious: yes
  minwidth: 500
  maxwidth: 1200
  cover_names: cover front folder art album
  sources: [filesystem, cover_art_url, coverart, itunes, albumart]
embedart:
  auto: yes
  ifempty: yes
paths:
  default: $albumartist/$album%aunique{}/$track $title
  comp: Compilations/$album%aunique{}/$track $title
  singleton: Singles/$artist/$track $title
duplicates:
  tiebreak:
    items: [bitrate, num_media, tracks]
# No import_action_* here: the quarantine operator answers per file (the inbox
# config skips bad files instead so they land here for review).
convert:
  dest: __BEETS_CONVERT_DIR__
  formats:
    aiff:
      extension: aiff
      command: ffmpeg -i $source -y -vn -acodec pcm_s16be $dest
    mp3:
      extension: mp3
      command: ffmpeg -i $source -y -vn -acodec libmp3lame -b:a 320k $dest
badfiles:
  check_on_import: yes
  commands:
    aac: beet-ffmpeg-check
    aif: beet-ffmpeg-check
    aiff: beet-ffmpeg-check
    flac: beet-ffmpeg-check
    m4a: beet-ffmpeg-check
    ogg: beet-ffmpeg-check
    opus: beet-ffmpeg-check
    wav: beet-ffmpeg-check
discogs:
  user_token: REPLACE_WITH_DISCOGS_USER_TOKEN
spotify:
  client_id: REPLACE_WITH_SPOTIFY_CLIENT_ID
  client_secret: REPLACE_WITH_SPOTIFY_CLIENT_SECRET
bandcamp:
  include_digital_only_tracks: true
  art: true
chroma:
  auto: yes
unimported:
  ignore_extensions: jpg png stfolder
  ignore_subdirectories: .stversions/
