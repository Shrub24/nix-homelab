# Scheduled cleanup of candidate refs outside the retention window. The
# credentials are the environment-bound App key the fleet's workflow selects.
name: candidate-sweep
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    uses: Shrub24/nix-fleet/.github/workflows/candidate-sweep.yml@v3
    permissions:
      contents: write
    secrets: inherit
