# secrets/.templates/services/bifrost.yaml – Bifrost gateway secrets
# Encrypted to: oci-melb-1 (gateway host)
# Key path: secrets/services/bifrost.yaml
#
# admin_username / admin_password protect the dashboard and management API
# (governance.auth_config). Generate the password with:
#   openssl rand -base64 24
bifrost:
  encryption_key: <value>
  admin_username: <value>
  admin_password: <value>
  gemini_api_key: <value>
  deepseek_api_key: <value>
  opencode_api_key: <value>
  openrouter_api_key: <value>
