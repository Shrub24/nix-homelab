# Validation: the fleet's reusable validator plus this repository's own contract
# tests. Routine CI evaluates and formats; it never builds a fleet output — that
# is fleet-build's dispatched path, and two publishers for one closure is how a
# cache starts lying.
#
# `fleet` runs nix-fleet's validate.yml at the pinned revision: formatting
# (`checks.<system>.treefmt`), an evaluation of every output on both systems with
# import-from-derivation disabled, and the generated flake/lock consistency check.
# `repo` runs the contract tests, which no fleet workflow knows about.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  # Callable by fleet-build.yml so validation gates the privileged build.
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fleet:
    uses: Shrub24/nix-fleet/.github/workflows/validate.yml@v3
    permissions:
      contents: read
    with:
      # The pull request's head, not the merge ref: the candidate pipeline
      # validates the same revision, and acceptance is bound to it.
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      generated_files: check
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The tracked-source contract compares the Git index against the tree.
          fetch-depth: 0
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      - name: Run the repository's contract tests
        run: nix develop --command just checks all
