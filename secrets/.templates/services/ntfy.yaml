# secrets/services/ntfy.yaml – ntfy server auth config block (do-admin-1 only)
# Encrypted to: owner, do-admin-1
# Decrypted as single file (key: "") and merged into server.yml via yq.
#
# The entire file content is the auth section of ntfy's config.
# Per-host identity model: each notification sender has its own user and token.
# The token value in auth-tokens must match the ntfy_token in that host's
# secrets/hosts/<host>/system.yaml (sent as Authorization: Bearer by the daemon).
#
# auth-users:
#   - "saurabhj:$2a$10$hash:admin"
#   - "notify-oci-melb-1::user"
#   - "notify-do-admin-1::user"
# auth-tokens:
#   - "notify-oci-melb-1:tk_xxxxx:publish from oci-melb-1"
#   - "notify-do-admin-1:tk_yyyyy:publish from do-admin-1"
auth-users:
  - "saurabhj:<value>"
  - "notify-oci-melb-1::user"
  - "notify-do-admin-1::user"
auth-tokens:
  - "notify-oci-melb-1:<ntfy_token from secrets/hosts/oci-melb-1/system.yaml>"
  - "notify-do-admin-1:<ntfy_token from secrets/hosts/do-admin-1/system.yaml>"
