# The repository's mutation-heavy contract tests, which cannot be `checks`: they
# mutate a source tree and realise fixtures. nixbot builds `checks` itself.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The tracked-source contract compares the Git index against the tree.
          fetch-depth: 0
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      - name: Run the repository's contract tests
        run: nix develop --command just checks all
