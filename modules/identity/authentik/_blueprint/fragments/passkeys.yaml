# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: homelab-passkeys
entries:
  - attrs:
      friendly_name: Passkey
      resident_key_requirement: required
      user_verification: required
    id: passkey-setup
    identifiers:
      name: default-authenticator-webauthn-setup
    model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
  - attrs:
      device_classes:
        - webauthn
      webauthn_user_verification: required
    id: passkey-validation
    identifiers:
      name: homelab-passkey-validation
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
  - attrs:
      case_insensitive_matching: true
      enable_remember_me: true
      password_stage: !Find [authentik_stages_password.passwordstage, [name, 
                default-authentication-password]]
      recovery_flow: !KeyOf recovery-flow
      user_fields:
        - username
        - email
      webauthn_stage: !KeyOf passkey-validation
    identifiers:
      name: default-authentication-identification
    model: authentik_stages_identification.identificationstage
  - attrs:
      allow_show_password: true
    identifiers:
      name: default-authentication-password
    model: authentik_stages_password.passwordstage
