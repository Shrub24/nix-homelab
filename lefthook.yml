pre-commit:
  commands:
    fmt:
      glob: "**/*.{nix,yaml,yml,toml,md,sh,json,tf,tfvars,py}"
      run: treefmt --allow-missing-formatter {staged_files}
      stage_fixed: true
    regen-flake-lock:
      glob: "flake.nix"
      run: nix flake lock
      stage_fixed: true
    regen-web-policy:
      run: ./scripts/export-web-services-policy.sh
      stage_fixed: true
    test-secret-scope:
      run: ./tests/check-secret-scope.sh
    test-web-policy:
      run: ./tests/check-web-services-policy.sh
