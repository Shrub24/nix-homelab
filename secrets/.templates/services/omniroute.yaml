# secrets/.templates/services/omniroute.yaml – OmniRoute LLM router bootstrap secrets
# Encrypted to: home-forge (omniroute service host)
# Key path: secrets/services/omniroute.yaml
omniroute:
  jwt_secret: <value>        # openssl rand -hex 32
  api_key_secret: <value>    # openssl rand -hex 32
  storage_encryption_key: <value> # openssl rand -hex 32; keep stable after first use
  initial_password: <value>  # dashboard admin bootstrap password
  ws_bridge_secret: <value>  # openssl rand -hex 32
