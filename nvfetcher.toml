# nvfetcher configuration for non-flake upstream package sources.
#
# Each [[package]] entry defines an upstream source whose version and hash
# metadata is generated into pkgs/_sources/generated.nix.
#
# Ownership boundary:
#   nvfetcher -> non-flake upstream sources (tarballs, git snapshots, etc.)
#   Renovate  -> flake inputs (flake.lock) and OCI image refs (policy/oci-images.nix)
#
# To add a new non-flake source, add a [[package]] section here.
# Then run: just deps refresh
#
# Docs: https://github.com/berberman/nvfetcher
